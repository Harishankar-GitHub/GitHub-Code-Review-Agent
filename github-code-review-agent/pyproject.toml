[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-code-review-agent"
version = "1.0.0"
description = "AI-powered GitHub PR code review agent using Kiro CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harishankar Bhat R" }]
keywords = ["github", "code-review", "ai", "kiro", "pull-request", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyGithub>=2.1.1",
    "PyYAML>=6.0",
    "mcp>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/<your-username>/github-code-review-agent"

[project.scripts]
gh-review = "github_code_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
